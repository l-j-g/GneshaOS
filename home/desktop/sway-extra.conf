# === Manjaro Sway look & feel ===
default_border pixel 1
default_floating_border pixel 1
hide_edge_borders smart
gaps inner __GAPS_INNER_PX__
gaps outer __GAPS_OUTER_PX__
smart_gaps on
floating_modifier Mod4 normal
seat seat0 hide_cursor 5000

# === Application defaults (Manjaro Sway) ===
for_window [title="(?:Open|Save) (?:File|Folder|As)"] floating enable, resize set 800 600
for_window [window_role="pop-up"] floating enable
for_window [window_role="bubble"] floating enable
for_window [window_role="task_dialog"] floating enable
for_window [window_role="Preferences"] floating enable
for_window [window_type="dialog"] floating enable
for_window [window_type="menu"] floating enable
for_window [app_id="firefox" title="^Library$"] floating enable, border pixel 1, sticky enable
for_window [app_id="floating_shell"] floating enable, border pixel 1, sticky enable
for_window [title="Picture in picture"] floating enable, sticky enable
for_window [title="Picture-in-Picture"] floating enable, sticky enable
for_window [title="Save File"] floating enable
for_window [title="Firefox .*— Sharing Indicator"] floating enable, sticky enable, move to scratchpad
for_window [title=".* is sharing your screen."] floating enable
for_window [title="^wlay$"] floating enable
seat * shortcuts_inhibitor disable

# === Resize mode (Mod+r) ===
set $mode_resize "<span foreground='#00ff9c'>󰉸</span> <b>Resize</b> (hjkl or arrows / ± gaps)"
mode --pango_markup $mode_resize {
  bindsym Left resize shrink width 10px
  bindsym Down resize grow height 10px
  bindsym Up resize shrink height 10px
  bindsym Right resize grow width 10px
  bindsym h resize shrink width 10px
  bindsym j resize grow height 10px
  bindsym k resize shrink height 10px
  bindsym l resize grow width 10px
  bindsym Shift+Left resize shrink width 50px
  bindsym Shift+Down resize grow height 50px
  bindsym Shift+Up resize shrink height 50px
  bindsym Shift+Right resize grow width 50px
  bindsym Shift+h resize shrink width 50px
  bindsym Shift+j resize grow height 50px
  bindsym Shift+k resize shrink height 50px
  bindsym Shift+l resize grow width 50px
  bindsym minus gaps inner current minus 5px
  bindsym plus gaps inner current plus 5px
  bindsym Return mode "default"
  bindsym Escape mode "default"
}

# === Scratchpad (Mod+minus shows, Mod+Shift+minus sends) ===
# (bindings live in desktop.nix keybindings)

# === Recording mode (Mod+Shift+r) ===
set $mode_recording recording
mode --pango_markup $mode_recording {
  bindsym r exec recorder.sh, mode "default"
  bindsym Shift+r exec recorder.sh -a, mode "default"
  bindsym Escape mode "default"
}

# === Screenshot mode (Print) ===
set $screenshot_screen grimshot --notify save output
set $screenshot_selection grimshot --notify save area
set $upload_pipe curl -s -F "file=@-;filename=.png" __SCREENSHOT_UPLOAD_URL__ | tee >(wl-copy) >(xargs notify-send)
set $screenshot_screen_upload grimshot save output - | $upload_pipe
set $screenshot_selection_upload grimshot save area - | $upload_pipe

set $mode_screenshot "screenshot (o/p)"
mode --pango_markup $mode_screenshot {
  bindsym o mode "default", exec $screenshot_screen
  bindsym Shift+o mode "default", exec $screenshot_screen_upload
  bindsym p mode "default", exec $screenshot_selection
  bindsym Shift+p mode "default", exec $screenshot_selection_upload
  bindsym Escape mode "default"
}

# === Shutdown mode (Mod+Shift+e) ===
set $mode_shutdown shutdown
set $purge_cliphist rm -f $HOME/.cache/cliphist/db
mode --pango_markup $mode_shutdown {
  bindsym l mode "default", exec swaylock
  bindsym e exec $purge_cliphist; exec swaymsg exit
  bindsym u mode "default", exec systemctl suspend
  bindsym s exec $purge_cliphist; exec systemctl poweroff
  bindsym r exec $purge_cliphist; exec systemctl reboot
  bindsym Escape mode "default"
}
