<!-- Oldest OpenCode wallpaper experiment: Matrix rain and phosphor glow. -->
<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="1440" viewBox="0 0 2160 1440">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#00ff9c" stop-opacity="0.10"/>
      <stop offset="70%" stop-color="#00ff41" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#050805" stop-opacity="0"/>
    </radialGradient>
    <pattern id="rain" width="96" height="64" patternUnits="userSpaceOnUse">
      <g font-family="monospace" font-size="20" font-weight="bold">
        <text x="4" y="16" fill="#00ff9c" fill-opacity="0.28">1</text>
        <text x="28" y="52" fill="#00ff41" fill-opacity="0.22">0</text>
        <text x="52" y="20" fill="#35ffcf" fill-opacity="0.20">1</text>
        <text x="76" y="56" fill="#00ff9c" fill-opacity="0.25">0</text>
        <text x="16" y="40" fill="#00ff41" fill-opacity="0.30">0</text>
        <text x="68" y="8" fill="#00ff9c" fill-opacity="0.24">1</text>
        <text x="44" y="36" fill="#ccff3d" fill-opacity="0.14">0</text>
        <text x="84" y="30" fill="#00ff41" fill-opacity="0.18">1</text>
      </g>
    </pattern>
  </defs>
  <rect width="2160" height="1440" fill="#050805"/>
  <rect width="2160" height="1440" fill="url(#glow)"/>
  <rect width="2160" height="1440" fill="url(#rain)"/>
  <text x="1080" y="1240" text-anchor="middle" font-family="monospace" font-size="40"
        fill="#00ff9c" fill-opacity="0.35" letter-spacing="12">wake up, Neo...</text>
</svg>
